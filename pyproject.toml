[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-behavior"
version = "0.1.0"
description = "LifeSim personalization with restaurant recommendation and observed feedback"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.2", "joblib>=1.2"]

[project.optional-dependencies]
lifesim = ["openai>=1.0", "chromadb==1.2.0", "sentence-transformers>=5.1", "transformers>=4.57", "pandas>=2.0", "json-repair==0.52.2", "editdistance==0.8.1", "tqdm>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
